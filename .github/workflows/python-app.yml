name: Python application

on:
  push:
    branches: [ "producao" ]
  pull_request:
    branches: [ "producao" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics


        
  Image:
    needs: build
    runs-on: ubuntu-latest


    steps:
      - name: Docker Login
        uses: docker/login-action@v4.8.0
        with:
          username: ${{secrets.DOCKER_USER}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build and push Docker images
        uses: docker/build-push-action@v7.4.0
        with:
          push: true
          tags: richsrd/api_producao

  deploy:
    needs: Image
    runs-on: ubuntu-latest

    steps:
      - name: Deploy na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 54.235.142.184
          username: ubuntu
          key: ${{secrets.CHAVE_PROD}}
          script: |
                echo "Acesso Liberado"
                sudo docker pull richsrd/api_producao
                sudo docker stop api_producao 2>/dev/null || true
                sudo docker rm api_producao 2>/dev/null || true
                # instalar nova versão
                sudo docker run --name api_producao -d -p 80:8080 richsrd/api_producao
      
